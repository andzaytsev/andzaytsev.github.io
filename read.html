
<!DOCTYPE html>
<html class="no-js">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
        <title>Basic ePubJS Example</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width">
        <meta name="apple-mobile-web-app-capable" content="yes">

        <link rel="stylesheet" href="resources/reader-css/normalize.css">
        <link rel="stylesheet" href="resources/reader-css/main.css">
        <link rel="stylesheet" href="resources/jquery-ui.min.css">
        <link rel="stylesheet" href="resources/jquery-ui.theme.min.css">


        <!-- EPUBJS Renderer -->
        <script src="resources/jquery.min.js"></script>
        <script src="resources/jquery-ui.min.js"></script>
        <script src="resources/zip.min.js"></script>
        <script src="resources/epub.min.js"></script>
        <script src="resources/hooks.min.js"></script>
        <script src="resources/reader.min.js"></script>
        <script src="resources/screenfull.min.js"></script>

        <style type="text/css">

          body {
            overflow: hidden;
          }

          #main {
            position: absolute;
            width: 100%;
            height: 100%;
          }

          #area {
            width: 80%;
            height: 80%;
            margin: 5% auto;
            max-width: 1250px;
          }

          #area iframe {
            border: none;
          }

          #prev {
            left: 40px;
          }

          #next {
            right: 40px;
          }

          .arrow {
            position: absolute;
            top: 50%;
            margin-top: -32px;
            font-size: 64px;
            color: #E2E2E2;
            font-family: arial, sans-serif;
            font-weight: bold;
            cursor: pointer;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
          }

          .arrow:hover {
            color: #777;
          }

          .arrow:active {
            color: #000;
          }
        </style>

         <script>
            "use strict";

            var dialog;

            function displayBook(path) {
              EPUBJS.cssPath = "resources/reader-css/";
              ePubReader(path);
            }

            function submitSelection() {
              dialog.dialog("close");
              $('#epubreader').show();
              var fname = $('#bookfn :selected').val();
              displayBook('books/' + fname);
            }

            document.onreadystatechange = function () {
              if (document.readyState == "complete") {
                // Hide the reader at first
                $('#epubreader').hide();
                // Create the modal for book selection
                dialog = $('#book-dialog').dialog({
                  modal: true,
                  buttons: {
                    "Submit": submitSelection
                  }
                })

                //displayBook("books/" + ere.epub);

              }
            };

        </script>
    </head>
    <body>
      <!-- Book selection modal -->
      <div id="book-dialog">
        <form id="fpath">
          <select id="bookfn">
            <option value="lagom.epu">Lagom, The Swedish Art of Balanced Living</option>
            <option value="frugalwoods.epub">Meet the Frugalwoods</option>
            <option value="allsouls.epub">All Souls Trilogy - Deborah Harkness</option>
            <option value="yourmoney.epub">Your Money or Your Life</option>
            <option value="disneyworld.epub">Unofficial Guide to Walt Disney World 2019</option>
            <option value="wild.epub">Wild by Cheryl Strayed</option>
            <option value="obelisk-gate.epub">The Obelisk Gate (Book 2) N.K. Jemisin</option>
            <option value="fifthseason.epub">The Fifth Season by N.K. Jemisin</option>
            <option value="esther.epub">Early Retirement Extreme</option>
            <option value="hpmor.epub">HPMOR</option>
          </select>
        </form>
      </div>

      <div id="epubreader">
        <div id="sidebar">
          <div id="panels">
            <input id="searchBox" placeholder="search" type="search">

            <a id="show-Search" class="show_view icon-search" data-view="Search">Search</a>
            <a id="show-Toc" class="show_view icon-list-1 active" data-view="Toc">TOC</a>
            <a id="show-Notes" class="show_view icon-edit" data-view="Notes">Notes</a>

          </div>

          <!-- Table of Contents -->
          <div id="tocView"></div>
          <!-- / Table of Contents -->

          <div id="searchView">
            <ul id="searchResults"></ul>
          </div>
        </div>
        <div id="main">

          <div id="titlebar">
            <div id="opener">
              <a id="slider" class="icon-menu">Menu</a>
            </div>
            <div id="metainfo">
              <span id="book-title"></span>
              <span id="title-seperator">&nbsp;&nbsp;–&nbsp;&nbsp;</span>
              <span id="chapter-title"></span>
            </div>

            <!-- Annotation Controls -->
            <div id="annotation-controls"></div>
            <!-- / Annotation Controls -->

          </div>

          <div id="divider"></div>
          <div id="prev" class="arrow">‹</div>
          <div id="viewer"></div>
          <div id="next" class="arrow">›</div>

          <div id="loader"><img src="resources/reader-img/loader.gif"></div>
        </div>

        <!--<div id="hypothesis">
          <iframe src="//hypothes.is/app.html" seamless></iframe>
        </div>-->

        <div class="modal md-effect-1" id="settings-modal">
            <div class="md-content">
                <h3>Settings</h3>
                <div>
                </div>
                <div class="closer icon-cancel-circled"></div>
            </div>
        </div>
        <div class="overlay"></div>
      </div>
    </body>
</html>
